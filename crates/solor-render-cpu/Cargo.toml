[package]
name = "solor-render-cpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "CPU rasterization of retained text frames for Solor"

[lints]
workspace = true

[features]
shader = ["solor/shader", "dep:solor-shader", "dep:rayon"]
layout-audit = ["solor/layout-audit"]

[dependencies]
solor-shader = { workspace = true, optional = true }
rayon = { version = "1", optional = true }
anyhow.workspace = true
solor = { workspace = true, features = ["glyph-raster", "svg-raster"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
solor-linux.workspace = true

[[example]]
name = "text_layout"
path = "examples/text_layout/main.rs"

[[example]]
name = "text_frame"
path = "examples/text_layout/frame_main.rs"

[[example]]
name = "text_pixels"
path = "examples/text_layout/pixels_main.rs"

[[example]]
name = "text_window"
path = "examples/text_layout/window_main.rs"
