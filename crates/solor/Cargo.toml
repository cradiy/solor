[package]
name = "solor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Platform-independent Solor GUI framework"

[features]
svg-raster = ["dep:resvg"]
glyph-raster = ["dep:swash"]
shader = ["dep:solor-shader"]
default = ["png", "jpeg"]
image-full = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"]
png = ["image/png"]
jpeg = ["image/jpeg", "dep:zune-jpeg"]
webp = ["image/webp"]
gif = ["image/gif"]
bmp = ["image/bmp"]
ico = ["image/ico"]
tiff = ["image/tiff"]
network = ["url", "dep:ureq", "dep:event-listener", "image"]
layout-audit = []

[dependencies]
resvg = { version = "=0.48.1", default-features = false, optional = true }
swash = { version = "=0.2.10", optional = true }
solor-shader = { workspace = true, optional = true }
event-listener = { version = "5.4", optional = true }
url = { version = "2.5", optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
log.workspace = true
async-task = "4.7.1"
zune-jpeg = { version = "0.5", optional = true, default-features = false, features = ["std"] }
image = { version = "0.25.10", optional = true, default-features = false }
usvg = { version = "=0.48.1", default-features = false }
keyboard-types = "0.8"
pastey = "0.2"
slotmap.workspace = true
smallvec.workspace = true
ttf-parser = { version = "0.25", default-features = false }
anyhow.workspace = true
color.workspace = true
smol_str = { version = "=0.3.7", default-features = false }
sys-locale = "0.3"
unicode-segmentation = "1"
web-time = "1"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "fontconfig"] }

[lints]
workspace = true

[[bench]]
name = "state_updates"
harness = false

[[example]]
name = "node_store"
path = "examples/node_store/main.rs"

[[example]]
name = "layout_contract"
required-features = ["layout-audit"]
path = "examples/layout_contract/main.rs"

[[example]]
name = "layout_cost_one"
required-features = ["layout-audit"]
path = "examples/layout_cost/one.rs"

[[example]]
name = "layout_cost_three"
required-features = ["layout-audit"]
path = "examples/layout_cost/three.rs"

[[bench]]
name = "refresh"
harness = false

[[bench]]
name = "list_splice"
harness = false
