[package]
name = "solor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Platform-independent Solor GUI framework"

[features]
default = ["png", "jpeg"]
image-full = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"]
png = ["dep:image", "image/png"]
jpeg = ["dep:image", "image/jpeg"]
webp = ["dep:image", "image/webp"]
gif = ["dep:image", "image/gif"]
bmp = ["dep:image", "image/bmp"]
ico = ["dep:image", "image/ico"]
tiff = ["dep:image", "image/tiff"]
layout-audit = []

[dependencies]
image = { version = "0.25.10", optional = true, default-features = false }
usvg = { version = "=0.48.1", default-features = false }
keyboard-types = "0.8"
pastey = "0.2"
slotmap.workspace = true
smallvec.workspace = true
ttf-parser = { version = "0.25", default-features = false }
anyhow.workspace = true
color = "=0.3.3"
smol_str = { version = "=0.3.7", default-features = false }
sys-locale = "0.3"
unicode-segmentation = "1"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "fontconfig"] }

[lints]
workspace = true

[[bench]]
name = "state_updates"
harness = false

[[example]]
name = "node_store"
path = "examples/node_store/main.rs"

[[example]]
name = "layout_contract"
required-features = ["layout-audit"]
path = "examples/layout_contract/main.rs"

[[example]]
name = "layout_cost_one"
required-features = ["layout-audit"]
path = "examples/layout_cost/one.rs"

[[example]]
name = "layout_cost_three"
required-features = ["layout-audit"]
path = "examples/layout_cost/three.rs"

[[bench]]
name = "refresh"
harness = false

[[bench]]
name = "list_splice"
harness = false
