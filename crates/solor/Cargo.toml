[package]
name = "solor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Platform-independent Solor GUI framework"

[features]
layout-audit = []

[dependencies]
slotmap.workspace = true
anyhow.workspace = true
color = "=0.3.3"
smol_str = { version = "=0.3.7", default-features = false }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"] }

[lints]
workspace = true

[[bench]]
name = "state_updates"
harness = false

[[example]]
name = "node_store"
path = "examples/node_store/main.rs"

[[example]]
name = "layout_contract"
required-features = ["layout-audit"]
path = "examples/layout_contract/main.rs"

[[example]]
name = "layout_cost_one"
required-features = ["layout-audit"]
path = "examples/layout_cost/one.rs"

[[example]]
name = "layout_cost_three"
required-features = ["layout-audit"]
path = "examples/layout_cost/three.rs"

[[bench]]
name = "refresh"
harness = false
