[package]
name = "solor-ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Retained elements and component composition for Solor"

[features]
layout-audit = ["solor-core/layout-audit"]

[dependencies]
anyhow = "1"
color = "=0.3.3"
solor-core = { path = "../solor-core" }
smol_str = { version = "=0.3.7", default-features = false }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"] }

[dev-dependencies]
swash = "=0.2.10"
png = "0.18"

[lints]
workspace = true

[[bench]]
name = "refresh"
harness = false

[[example]]
name = "text_layout"
path = "examples/text_layout/main.rs"

[[example]]
name = "text_frame"
path = "examples/text_layout/frame_main.rs"

[[example]]
name = "text_pixels"
path = "examples/text_layout/pixels_main.rs"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[[example]]
name = "text_window"
path = "examples/text_layout/window_main.rs"
