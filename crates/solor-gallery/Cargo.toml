[package]
name = "solor-gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An interactive gallery of Solor interface primitives"

[lints]
workspace = true

[features]
gpu = ["shader", "solor-platform/gpu"]
shader = ["solor-platform/shader", "solor-render-cpu/shader"]

[dependencies]
anyhow.workspace = true
log.workspace = true
solor = { workspace = true, default-features = true }
solor-platform.workspace = true

[dev-dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }
solor-render-cpu.workspace = true

[[example]]
name = "timed_text"
required-features = ["shader"]

[[example]]
name = "pool"
required-features = ["shader"]

[[example]]
name = "gpu_fills"
required-features = ["gpu"]
