[package]
name = "solor-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Core data structures for the Solor GUI experiment"

[features]
layout-audit = []

[dependencies]
slotmap.workspace = true

[dev-dependencies]
smol_str = { version = "=0.3.7", default-features = false }
swash = "=0.2.10"
png = "0.18"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"] }

[lints]
workspace = true

[[bench]]
name = "state_updates"
harness = false

[[example]]
name = "node_store"
path = "examples/node_store/main.rs"

[[example]]
name = "layout_contract"
required-features = ["layout-audit"]
path = "examples/layout_contract/main.rs"

[[example]]
name = "layout_cost_one"
required-features = ["layout-audit"]
path = "examples/layout_cost/one.rs"

[[example]]
name = "layout_cost_three"
required-features = ["layout-audit"]
path = "examples/layout_cost/three.rs"

[[example]]
name = "text_layout"
path = "examples/text_layout/main.rs"

[[example]]
name = "text_frame"
path = "examples/text_layout/frame_main.rs"

[[example]]
name = "text_pixels"
path = "examples/text_layout/pixels_main.rs"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[[example]]
name = "text_window"
path = "examples/text_layout/window_main.rs"
