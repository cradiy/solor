[package]
name = "solor-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Linux platform implementation for Solor"

[features]
gpu = ["dep:solor-render-gpu", "dep:wgpu", "dep:pollster", "wayland-client/system"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
solor-render-gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
xkbcommon = { version = "0.9", default-features = false }
dbus = "0.9"
solor.workspace = true
smallvec.workspace = true
anyhow.workspace = true
log.workspace = true
rustix = { version = "1", features = ["fs", "time", "event", "pipe"] }
percent-encoding = "2"
futures-channel = "0.3"
wayland-client = "0.31"
xcursor = "0.3"
cursor-icon = "1"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
