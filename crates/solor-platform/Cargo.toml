[package]
name = "solor-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "System platform selection and window hosting for Solor"

[lints]
workspace = true

[features]
gpu = ["solor-linux/gpu", "solor-macos/gpu"]
shader = ["solor/shader", "solor-render-cpu/shader"]

[dependencies]
anyhow.workspace = true
solor.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
solor-linux.workspace = true
solor-render-cpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
solor-macos.workspace = true
solor-render-cpu.workspace = true

[[example]]
name = "image"
required-features = ["solor/webp"]

[[example]]
name = "gradient_map"
required-features = ["solor/webp"]

[dev-dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }

[[example]]
name = "cpu_shader"
required-features = ["shader"]

[[test]]
name = "cpu_shader"
required-features = ["shader"]
