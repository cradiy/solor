[workspace]
members = ["crates/solor", "crates/solor-gallery", "crates/solor-linux", "crates/solor-platform", "crates/solor-render-cpu", "crates/solor-shader", "crates/solor-render-gpu"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
solor = { path = "crates/solor", default-features = false }
solor-linux = { path = "crates/solor-linux" }
solor-platform = { path = "crates/solor-platform" }
solor-render-cpu = { path = "crates/solor-render-cpu" }
solor-shader = { path = "crates/solor-shader" }
solor-render-gpu = { path = "crates/solor-render-gpu" }
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
color = "=0.3.3"
pollster = "0.4"
anyhow = "1"
log = "0.4"
slotmap = "1.1.1"
smallvec = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
