[workspace]
members = ["crates/solor", "crates/solor-gallery", "crates/solor-linux", "crates/solor-platform", "crates/solor-render-cpu"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
solor = { path = "crates/solor" }
solor-platform = { path = "crates/solor-platform" }
anyhow = "1"
slotmap = "1.1.1"
smallvec = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
